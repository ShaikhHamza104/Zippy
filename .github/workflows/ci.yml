name: Zippy CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target Deployment Environment'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'staging'
          - 'production'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Code Quality & Static Analysis (ESLint)
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint Across Workspaces
        run: pnpm lint

  # ----------------------------------------------------------------------------
  # Job 2: Security & Supply Chain Vulnerability Audit
  # ----------------------------------------------------------------------------
  security-audit:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm Audit (Production Scope)
        run: pnpm audit --prod --audit-level=high

  # ----------------------------------------------------------------------------
  # Job 3: Automated Unit & Integration Tests (with Database Containers)
  # ----------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password_2026
          MYSQL_DATABASE: zippy_ci
          MYSQL_USER: zippy_ci_user
          MYSQL_PASSWORD: zippy_ci_password_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: mysql://zippy_ci_user:zippy_ci_password_2026@127.0.0.1:3306/zippy_ci
      SHADOW_DATABASE_URL: mysql://zippy_ci_user:zippy_ci_password_2026@127.0.0.1:3306/zippy_ci_shadow
      MONGODB_URI: mongodb://127.0.0.1:27017/zippy_ci
      JWT_ACCESS_SECRET: test_jwt_access_secret_must_be_at_least_32_chars_long
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_must_be_at_least_32_chars_long
      JWT_RESET_PASSWORD_SECRET: test_jwt_reset_password_secret_32_chars_min
      JWT_EMAIL_VERIFICATION_SECRET: test_jwt_email_verification_secret_32_min
      COOKIE_SECURE: false
      CLIENT_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      SUPER_ADMIN_NAME: "CI Super Admin"
      SUPER_ADMIN_EMAIL: "admin@zippy.test"
      SUPER_ADMIN_PASSWORD: "StrongTestPassword#2026"
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma ORM Engine
        run: pnpm --filter @zippy/server prisma:generate

      - name: Run Prisma Schema Deploy Migrations
        run: pnpm --filter @zippy/server prisma:deploy

      - name: Execute Full Vitest Test Suite (Server + Client)
        run: pnpm test

  # ----------------------------------------------------------------------------
  # Job 4: Client Production Bundle Compilation
  # ----------------------------------------------------------------------------
  build:
    name: Production Asset Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Client Bundle (Vite)
        run: pnpm build

      - name: Verify Distribution Artifacts
        run: |
          test -f client/dist/index.html || { echo "client/dist/index.html missing"; exit 1; }
          echo "Production frontend build completed successfully."

  # ----------------------------------------------------------------------------
  # Job 5: Production Deployment Template (Manual or Continuous on Main)
  # ----------------------------------------------------------------------------
  deploy:
    name: Production Deployment Release
    runs-on: ubuntu-latest
    needs: [test, build, security-audit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_target == 'production')
    environment:
      name: production
      url: https://zippy.yourdomain.com
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Display Deployment Metadata
        run: |
          echo "Initiating production release for commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Deploying to production target cluster."

      # Optional Webhook Deployment Trigger (e.g. Render / Railway deploy hook)
      - name: Trigger Deploy Webhook (If configured)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" || echo "Webhook trigger completed."

      # Optional SSH-based VPS Deployment Action
      # - name: Deploy via SSH to VPS Host
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.PROD_SERVER_IP }}
      #     username: ${{ secrets.PROD_SERVER_USER }}
      #     key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /opt/zippy
      #       git pull origin main
      #       docker compose -f docker-compose.prod.yml pull
      #       docker compose -f docker-compose.prod.yml run --rm server npx prisma migrate deploy
      #       docker compose -f docker-compose.prod.yml up -d --build
      #       docker system prune -f
