# ==============================================================================
# ZIPPY PRODUCTION VIRTUAL HOST CONFIGURATION (docker/nginx/default.conf)
# SPA Frontend Static Delivery + API Reverse Proxy + Security Headers
# ==============================================================================

upstream backend_upstream {
    server server:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server (Port 80)
# Handles ACME challenge for Let's Encrypt and serves frontend / proxies API
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. ACME challenge path for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 2. Strict Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 3. Hashed Vite Static Assets: Cache indefinitely (1 year immutable)
    location ~* ^/assets/.*\.(?:js|css|woff2?|eot|ttf|otf|png|jpe?g|webp|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 4. Standard Browser Meta Files
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # 5. Reverse Proxy for Backend REST APIs (/api/)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Resilience and buffer tuning
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 6. Reverse Proxy for Uploaded Media Files (/uploads/)
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache processed images
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 7. Reverse Proxy for Backend Health Checks (/health)
    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 8. Single-Page Application (SPA) Fallback
    # Non-asset HTML requests return index.html for client-side routing
    # (To redirect all HTTP traffic to HTTPS after issuing certificates, replace this block with: return 301 https://$host$request_uri;)
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html to ensure atomic deployment updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

