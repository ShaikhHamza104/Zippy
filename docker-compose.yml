# ==============================================================================
# ZIPPY DEVELOPMENT DOCKER COMPOSE CONFIGURATION (docker-compose.yml)
# Starts local databases and application services for development
# ==============================================================================

name: zippy-dev

services:
  mysql:
    image: mysql:8.4
    container_name: zippy-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zippy_root_dev_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zippy_dev}
      MYSQL_USER: ${MYSQL_USER:-zippy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zippy_user_dev_pass}
    ports:
      - '3306:3306'
    volumes:
      - zippy_dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER:-zippy_user} -p$${MYSQL_PASSWORD:-zippy_user_dev_pass} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - zippy-dev-net

  mongodb:
    image: mongo:8.0
    container_name: zippy-dev-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - zippy_dev_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zippy-dev-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: zippy-dev-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: mysql://${MYSQL_USER:-zippy_user}:${MYSQL_PASSWORD:-zippy_user_dev_pass}@mysql:3306/${MYSQL_DATABASE:-zippy_dev}
      MONGODB_URI: mongodb://mongodb:27017/${MYSQL_DATABASE:-zippy_dev}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_only_jwt_access_secret_min_32_characters_long_zippy_app}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_only_jwt_refresh_secret_min_32_characters_long_zippy_app}
      JWT_RESET_PASSWORD_SECRET: ${JWT_RESET_PASSWORD_SECRET:-dev_only_jwt_reset_secret_min_32_characters_long_zippy_app}
      JWT_EMAIL_VERIFICATION_SECRET: ${JWT_EMAIL_VERIFICATION_SECRET:-dev_only_jwt_verify_secret_min_32_characters_long_zippy_app}
      COOKIE_SECURE: "false"
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-"Hamza Shaikh"}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@zippy.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-"StrongDevPassword#2026"}
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads
    ports:
      - '5000:5000'
    volumes:
      - zippy_dev_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - zippy-dev-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: zippy-dev-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '5173:80'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zippy-dev-net

volumes:
  zippy_dev_mysql_data:
  zippy_dev_mongo_data:
  zippy_dev_uploads:

networks:
  zippy-dev-net:
    driver: bridge
