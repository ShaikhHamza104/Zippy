# ==============================================================================
# ZIPPY PRODUCTION DOCKER COMPOSE CONFIGURATION (docker-compose.prod.yml)
# Hardened multi-container production stack with persistent storage, resource
# quotas, non-root execution, healthchecks, and internal bridge networking.
# ==============================================================================

name: zippy-prod

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL Relational Database Service (v8.4 LTS)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: zippy-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zippy_production}
      MYSQL_USER: ${MYSQL_USER:-zippy_prod_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
    volumes:
      - zippy_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER:-zippy_prod_user} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - zippy_internal_network

  # ----------------------------------------------------------------------------
  # 2. MongoDB Document Database Service (v8.0)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: zippy-prod-mongo
    restart: unless-stopped
    volumes:
      - zippy_mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - zippy_internal_network

  # ----------------------------------------------------------------------------
  # 3. Node.js Express REST API Backend Service
  # ----------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: zippy-prod-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER:-zippy_prod_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-zippy_production}}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/${MYSQL_DATABASE:-zippy_production}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      JWT_RESET_PASSWORD_SECRET: ${JWT_RESET_PASSWORD_SECRET:?JWT_RESET_PASSWORD_SECRET required}
      JWT_EMAIL_VERIFICATION_SECRET: ${JWT_EMAIL_VERIFICATION_SECRET:?JWT_EMAIL_VERIFICATION_SECRET required}
      COOKIE_SECURE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://zippy.yourdomain.com}
      CLIENT_URL: ${CLIENT_URL:-https://zippy.yourdomain.com}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-"Zippy Operations Admin"}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Zippy <no-reply@zippy.com>"}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-}
    volumes:
      - zippy_prod_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - zippy_internal_network

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy & Client SPA Delivery Service
  # ----------------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: zippy-prod-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - zippy_nginx_certs:/etc/letsencrypt:ro
      - zippy_certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - zippy_internal_network

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  zippy_mysql_prod_data:
    driver: local
  zippy_mongo_prod_data:
    driver: local
  zippy_prod_uploads:
    driver: local
  zippy_nginx_certs:
    driver: local
  zippy_certbot_www:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  zippy_internal_network:
    driver: bridge
